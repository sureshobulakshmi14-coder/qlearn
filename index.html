<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q-Learn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A24;--side:#0E0C2C;--pan:#14123A;--pan2:#1A1747;--ln:#26235A;--tx:#EDEAFF;--mu:#9A96C4;--cy:#3FE0F0;--pu:#B07CFF}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--tx);font:15px/1.5 Inter,sans-serif}
svg{flex:none}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--ln);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:26px}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--cy),var(--pu))}
.eye{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--cy)}
aside .eye{color:var(--mu);margin:0 6px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mu);padding:10px;border-radius:9px;font:inherit;cursor:pointer;text-align:left}
.nav button.on{background:#1B2B4C;color:var(--cy)}
.nav button.on::after{content:"";margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--cy)}
.streak{margin-top:auto;background:var(--pan);border:1px solid var(--ln);border-radius:12px;padding:14px}
.streak b{font-size:26px;display:block;line-height:1.2}
.streak small{color:var(--mu);font-size:12px}
main{padding:28px clamp(16px,4vw,44px) 60px;max-width:900px;width:100%}
h1{font-size:clamp(30px,5vw,40px);line-height:1.1;margin:6px 0 10px;letter-spacing:-.02em}
h2,h3{margin:0;letter-spacing:-.01em}
.sub{color:var(--mu);max-width:48ch;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
select{background:var(--pan);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;font:inherit}
.panel{background:var(--pan);border:1px solid var(--ln);border-radius:16px;margin-bottom:20px;overflow:hidden}
.ph{display:flex;justify-content:space-between;padding:16px 18px 8px}
.ph span:last-child{font:12px 'JetBrains Mono',monospace;color:var(--mu)}
.list{padding:6px 10px 12px;max-height:520px;overflow:auto}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--tx);padding:10px;border-radius:11px;font:inherit;cursor:pointer;text-align:left}
.mrow.on{background:#1B2B4C}
.mrow:hover{background:var(--pan2)}
.ib{width:36px;height:36px;border-radius:9px;background:var(--pan2);display:grid;place-items:center;color:var(--mu)}
.mrow.on .ib{background:#123A52;color:var(--cy)}
.mrow div{flex:1;min-width:0}
.mrow b{display:block;font-size:14px;font-weight:600}
.mrow small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font:11px 'JetBrains Mono',monospace;color:var(--mu)}
.done{color:var(--cy)}
.lesson{padding:28px clamp(16px,4vw,32px)}
.meta{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:12px;margin-bottom:18px;flex-wrap:wrap}
.chip{background:#123A52;color:var(--cy);border-radius:7px;padding:3px 9px;font-size:12px}
.lesson h2{font-size:clamp(24px,4vw,30px)}
.body{padding:0 clamp(16px,4vw,32px) 28px;border-top:1px solid var(--ln);margin-top:22px;padding-top:22px}
.body p{font-size:17px;line-height:1.75;margin:0 0 20px}
.ex{background:#0E1030;border:1px solid #1E4A6A;border-radius:12px;padding:14px 16px;margin-bottom:22px}
.ex .eye{margin-bottom:8px}
.ex pre{margin:0;font:13px/1.6 'JetBrains Mono',monospace;color:#B7B4DD;white-space:pre-wrap;overflow-x:auto}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pan);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer}
.btn.pu{background:var(--pu);border-color:var(--pu);color:#1A0B3D}
.btn.cy{background:var(--cy);border-color:var(--cy);color:#04303A}
.btn:disabled{opacity:.6;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:16px}
.stat b{font-size:30px;display:block}.stat span{color:var(--mu);font-size:13px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font:12px 'JetBrains Mono',monospace;color:var(--mu)}
.bar i{flex:1;height:14px;background:#221F52;border-radius:5px;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--cy));transition:width .5s}
.bar span:first-child{min-width:74px}
.q{font-weight:500;margin:0 0 12px}
.chat{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{white-space:pre-wrap;padding:10px 14px;border-radius:12px;max-width:85%}
.me{background:var(--pan2);align-self:flex-end}.ai{background:#123A52;align-self:flex-start}
input[type=text]{flex:1;min-width:0;background:var(--pan);border:1px solid var(--ln);color:var(--tx);border-radius:9px;padding:10px 12px;font:inherit}
@media(max-width:700px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;padding:10px;overflow-x:auto;gap:8px;align-items:center}
 aside .eye,.streak,.logo span{display:none}.logo{margin:0}
 .nav{flex-direction:row}.nav button{white-space:nowrap}.nav button.on::after{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
 <script>
  // Ungal JS Logic or Render Functions
 </script>
 
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span>Q-Learn</span></div>
  <div class="eye">Learning workspace</div>
  <div class="nav" id="nav"></div>
  <div class="streak"><div class="eye" style="color:var(--pu)">Your streak</div><b id="sk">0</b><small>days active<br>Built from your lesson, quiz, tutor and lab activity.</small></div>
</aside>
<main id="app"></main>
</div>
<script>
const API = window.API_BASE || '';
const USER = localStorage.getItem('ql_user') || (()=>{const u='u'+Math.random().toString(36).slice(2,8);localStorage.setItem('ql_user',u);return u})();
/*LOCAL*/
const DATA={"modules": [{"id": "qubits", "subject": "Quantum", "title": "Qubits & superposition", "text": "A classical bit is 0 or 1. A qubit holds two amplitudes; their squared sizes are the odds of measuring 0 or 1.", "example": "State = 0.6|0> + 0.8|1>  ->  P(0) = 0.36, P(1) = 0.64. Measuring gives 1 about 64% of the time."}, {"id": "gates", "subject": "Quantum", "title": "Quantum gates", "text": "H makes superposition, X flips, Z/Y/S change phase. Every algorithm is a chain of gates.", "example": "Start at |0>, apply H: an equal mix of |0> and |1>. Apply H again: back to |0>."}, {"id": "measure", "subject": "Quantum", "title": "Measurement", "text": "Measuring collapses a qubit to 0 or 1 with probability |amplitude|^2. After that the superposition is gone.", "example": "(|0> + |1>)/sqrt2 measured gives 0 or 1 with 50% each. Afterwards the qubit stays at that value."}, {"id": "phase", "subject": "Quantum", "title": "Phase & interference", "text": "Amplitudes can be negative or complex. When paths add up (interference) wrong answers cancel and right answers grow. This is the real power behind quantum speedups.", "example": "H, then Z, then H turns |0> into |1>. The sign change makes the |0> paths cancel."}, {"id": "entangle", "subject": "Quantum", "title": "Entanglement", "text": "H then CNOT makes a Bell pair: the two qubits always give the same result, even though each result alone is random.", "example": "H on q0 then CNOT(q0 -> q1) gives (|00> + |11>)/sqrt2. You only ever see 00 or 11."}, {"id": "dj", "subject": "Quantum", "title": "Deutsch-Jozsa algorithm", "text": "It decides if a hidden function is constant or balanced using one query, where a classical computer may need many. Load it in the Circuit Lab.", "example": "Balanced oracle on 2 qubits: measuring q0 at the end gives 1, never 0. A constant oracle gives 0."}, {"id": "grover", "subject": "Quantum", "title": "Grover search", "text": "Finds a marked item among N in about sqrt(N) steps by repeating two moves: flip the marked item's phase, then reflect all amplitudes about their average.", "example": "4 items, 1 marked: a single Grover round makes the marked state appear with 100% probability."}, {"id": "shor", "subject": "Quantum", "title": "Shor's algorithm (idea)", "text": "Shor factors big numbers by finding the period of a function using the quantum Fourier transform. This is why quantum computers threaten RSA encryption.", "example": "Factor 15: the period of 7^x mod 15 is 4, and gcd(7^2 - 1, 15) = 3 gives the factors 3 and 5."}, {"id": "html1", "subject": "HTML", "title": "HTML basics", "text": "HTML structures a page with elements like <h1>, <p>, <a> and <button>. Every page sits inside <html>, with <head> for settings and <body> for what you see.", "code": "<!DOCTYPE html>\n<html>\n<head><title>My page<\/title><\/head>\n<body>\n  <h1>Hello Quantum<\/h1>\n  <p>My first page<\/p>\n<\/body>\n<\/html>"}, {"id": "html2", "subject": "HTML", "title": "Links, images & lists", "text": "Use <a href> for links, <img src alt> for images, <ul>/<ol> with <li> for lists. Always write alt text so screen readers can describe images.", "code": "<a href=\"https://example.com\">Visit<\/a>\n<img src=\"qubit.png\" alt=\"Qubit diagram\">\n<ul>\n  <li>H gate<\/li>\n  <li>X gate<\/li>\n<\/ul>"}, {"id": "html3", "subject": "HTML", "title": "Forms & inputs", "text": "Forms collect input. <input> has a type (text, number, email), <label> names it, and <button> sends it.", "code": "<form>\n  <label for=\"q\">Qubits<\/label>\n  <input id=\"q\" type=\"number\" min=\"1\" max=\"3\">\n  <button type=\"submit\">Run<\/button>\n<\/form>"}, {"id": "css1", "subject": "HTML", "title": "CSS styling", "text": "CSS styles HTML. A rule has a selector and properties. Use flexbox to lay items in a row and media queries to adapt to phones.", "code": ".card {\n  background: #1D1740;\n  border-radius: 12px;\n  padding: 16px;\n}\n.row { display: flex; gap: 8px; }\n@media (max-width: 600px) {\n  .row { flex-direction: column; }\n}"}, {"id": "js1", "subject": "HTML", "title": "JavaScript & fetch", "text": "JavaScript makes pages interactive. fetch() talks to your Python backend and returns JSON you can show on screen.", "code": "const r = await fetch('/api/simulate', {\n  method: 'POST',\n  headers: {'Content-Type': 'application/json'},\n  body: JSON.stringify({qubits: 1, steps: [{type:'H', qubit:0}]})\n});\nconst data = await r.json();\nconsole.log(data.probs);"}, {"id": "py1", "subject": "Python", "title": "Variables & types", "text": "Python needs no type declarations. Common types: int, float, str, bool, and complex, which quantum code uses for amplitudes.", "code": "shots = 1024\np0 = 0.5\nname = 'Bell'\namp = 1/2**0.5 + 0j\nprint(type(amp), abs(amp)**2)"}, {"id": "py2", "subject": "Python", "title": "Lists & loops", "text": "Lists hold many values. A for loop visits each one. List comprehensions build new lists in one line.", "code": "probs = [0.5, 0, 0, 0.5]\nfor i, p in enumerate(probs):\n    print(format(i, '02b'), p)\n\npercent = [p * 100 for p in probs]"}, {"id": "py3", "subject": "Python", "title": "Functions & dictionaries", "text": "def defines a function; dictionaries map keys to values. Our gate table is a dictionary of matrices.", "code": "GATES = {'X': [[0, 1], [1, 0]]}\n\ndef apply(matrix, a0, a1):\n    return (matrix[0][0]*a0 + matrix[0][1]*a1,\n            matrix[1][0]*a0 + matrix[1][1]*a1)\n\nprint(apply(GATES['X'], 1, 0))"}, {"id": "py4", "subject": "Python", "title": "Simulating a qubit", "text": "A whole quantum simulator is just a list of complex numbers plus matrix maths. Measuring means picking an index using the probabilities.", "code": "import random\n\nstate = [2**-0.5, 2**-0.5]\nprobs = [abs(a)**2 for a in state]\nresult = random.choices([0, 1], weights=probs)[0]\nprint('Measured', result)"}, {"id": "py5", "subject": "Python", "title": "Flask API", "text": "Flask turns Python functions into web routes. The frontend calls them with fetch() and receives JSON.", "code": "from flask import Flask, jsonify\napp = Flask(__name__)\n\n@app.get('/api/hello')\ndef hello():\n    return jsonify(msg='Hello from Python')\n\napp.run(port=5000)"}, {"id": "java1", "subject": "Java", "title": "Java basics", "text": "Java is statically typed: every variable has a declared type. Code lives inside classes, and execution starts at main().", "code": "public class Main {\n    public static void main(String[] args) {\n        int qubits = 2;\n        double p0 = 0.5;\n        String name = \"Bell\";\n        System.out.println(name + \" uses \" + qubits + \" qubits\");\n    }\n}"}, {"id": "java2", "subject": "Java", "title": "Loops, arrays & methods", "text": "Arrays have a fixed size. A for loop visits each item. Methods group reusable code and declare their return type.", "code": "public class Main {\n    static double total(double[] probs) {\n        double sum = 0;\n        for (double p : probs) sum += p;\n        return sum;\n    }\n    public static void main(String[] args) {\n        double[] probs = {0.5, 0, 0, 0.5};\n        System.out.println(total(probs));\n    }\n}"}, {"id": "java3", "subject": "Java", "title": "Classes & objects (OOP)", "text": "A class is a blueprint, an object is one instance. Fields store data, the constructor sets it up, and methods act on it.", "code": "class Qubit {\n    private double p0;\n    Qubit(double p0) { this.p0 = p0; }\n    int measure() {\n        return Math.random() < p0 ? 0 : 1;\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Qubit q = new Qubit(0.5);\n        System.out.println(q.measure());\n    }\n}"}, {"id": "c1", "subject": "C", "title": "C basics", "text": "C is compiled and close to the hardware. You include headers, write main(), and print with printf using format codes like %d and %f.", "code": "#include <stdio.h>\n\nint main(void) {\n    int qubits = 2;\n    float p0 = 0.5f;\n    printf(\"Qubits: %d, P(0) = %.2f\\n\", qubits, p0);\n    return 0;\n}"}, {"id": "c2", "subject": "C", "title": "Arrays & pointers", "text": "An array is a block of memory. A pointer stores an address, and * reads the value at that address. Arrays decay to pointers when passed to functions.", "code": "#include <stdio.h>\n\nvoid doubleAll(int *a, int n) {\n    for (int i = 0; i < n; i++) a[i] *= 2;\n}\nint main(void) {\n    int x[3] = {1, 2, 3};\n    doubleAll(x, 3);\n    printf(\"%d %d %d\\n\", x[0], x[1], x[2]);\n    return 0;\n}"}, {"id": "c3", "subject": "C", "title": "Structs & memory", "text": "A struct groups related fields. malloc gives you memory on the heap; you must free it yourself or it leaks.", "code": "#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct { double re, im; } Complex;\n\nint main(void) {\n    Complex *a = malloc(sizeof(Complex));\n    a->re = 0.7; a->im = 0.0;\n    printf(\"%.1f\\n\", a->re);\n    free(a);\n    return 0;\n}"}, {"id": "jsx1", "subject": "JavaScript", "title": "Variables & functions", "text": "Use const for values that don't change and let for ones that do. Arrow functions are a short way to write functions.", "code": "const shots = 100;\nlet count = 0;\nconst square = (x) => x * x;\n\nfor (let i = 0; i < shots; i++) {\n  if (Math.random() < 0.5) count++;\n}\nconsole.log(count, square(4));"}, {"id": "jsx2", "subject": "JavaScript", "title": "Arrays & objects", "text": "Arrays hold ordered values, objects hold key-value pairs. map, filter and reduce transform arrays without loops.", "code": "const probs = [0.5, 0, 0, 0.5];\nconst percent = probs.map(p => p * 100);\nconst nonZero = probs.filter(p => p > 0);\nconst total = probs.reduce((a, b) => a + b, 0);\nconst gate = { name: \"H\", qubit: 0 };\nconsole.log(percent, nonZero, total, gate.name);"}, {"id": "jsx3", "subject": "JavaScript", "title": "Async & promises", "text": "Network calls take time. async/await lets you wait for a result without freezing the page. Always wrap it in try/catch.", "code": "async function loadStats() {\n  try {\n    const res = await fetch(\"/api/stats\");\n    const data = await res.json();\n    console.log(data.correct, \"correct\");\n  } catch (err) {\n    console.error(\"Server not reachable\", err);\n  }\n}\nloadStats();"}, {"id": "sql1", "subject": "SQL", "title": "SELECT & WHERE", "text": "SQL talks to databases. SELECT picks columns, FROM names the table, WHERE keeps only rows that match a condition.", "code": "SELECT module\nFROM progress\nWHERE user = 'guest';"}, {"id": "sql2", "subject": "SQL", "title": "INSERT, UPDATE & DELETE", "text": "INSERT adds a row, UPDATE changes existing rows, DELETE removes them. Always add a WHERE to UPDATE and DELETE or you change every row.", "code": "INSERT INTO quiz (user, qi, ok) VALUES ('guest', 3, 1);\nUPDATE quiz SET ok = 0 WHERE user = 'guest' AND qi = 3;\nDELETE FROM quiz WHERE user = 'guest';"}, {"id": "sql3", "subject": "SQL", "title": "GROUP BY & JOIN", "text": "GROUP BY with COUNT or SUM summarises rows. JOIN combines two tables using a shared column.", "code": "SELECT user, COUNT(*) AS attempts, SUM(ok) AS correct\nFROM quiz\nGROUP BY user\nORDER BY correct DESC;"}, {"id": "cpp1", "subject": "C++", "title": "C++ basics", "text": "C++ extends C with classes and a rich standard library. Use cout to print and cin to read input.", "code": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int qubits = 2;\n    cout << \"Qubits: \" << qubits << endl;\n    return 0;\n}"}, {"id": "cpp2", "subject": "C++", "title": "Vectors & references", "text": "std::vector is a resizable array. Passing by reference (&) avoids copying big data and lets a function change the original.", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid normalise(vector<double> &v, double sum) {\n    for (double &x : v) x /= sum;\n}\nint main() {\n    vector<double> p = {2, 2};\n    normalise(p, 4);\n    cout << p[0] << \" \" << p[1] << endl;\n}"}, {"id": "cpp3", "subject": "C++", "title": "Classes & constructors", "text": "A C++ class bundles data and methods. The constructor runs when an object is created, and private members stay hidden.", "code": "#include <iostream>\nusing namespace std;\n\nclass Gate {\n    string name;\npublic:\n    Gate(string n) : name(n) {}\n    void show() { cout << \"Gate \" << name << endl; }\n};\nint main() {\n    Gate h(\"H\");\n    h.show();\n}"}, {"id": "ds1", "subject": "Data Structures", "title": "Stack & queue", "text": "A stack is last-in-first-out (undo history). A queue is first-in-first-out (task line). Both add and remove in O(1).", "code": "stack = []\nstack.append(1); stack.append(2)\nprint(stack.pop())      # 2 (last in, first out)\n\nfrom collections import deque\nqueue = deque([1, 2])\nprint(queue.popleft())  # 1 (first in, first out)"}, {"id": "ds2", "subject": "Data Structures", "title": "Linked list & hash map", "text": "A linked list chains nodes by pointers, so insertion is cheap but lookup is slow. A hash map finds a key in about O(1) time.", "code": "class Node:\n    def __init__(self, val, nxt=None):\n        self.val, self.nxt = val, nxt\n\nhead = Node(1, Node(2, Node(3)))\ncur = head\nwhile cur:\n    print(cur.val)\n    cur = cur.nxt\n\nscores = {\"asha\": 8, \
